name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Ensure audio decoder
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate Compose without real credentials
        env:
          API_KEY: fixture-only
          NAPCAT_WEBUI_TOKEN: fixture-only
          ASTRBOT_IMAGE: soulter/astrbot:v4.29.1
          NAPCAT_IMAGE: mlikiowa/napcat-docker:latest
        run: docker compose config --quiet
