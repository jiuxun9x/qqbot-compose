name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies and decoder
        timeout-minutes: 4
        run: |
          python -m pip install -r tests/requirements.txt imageio-ffmpeg==0.6.0
          if ! command -v ffmpeg >/dev/null; then
            decoder=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            sudo install -m 755 "$decoder" /usr/bin/ffmpeg
          fi
          ffmpeg -version
      - run: python -m unittest discover -s tests -v
      - name: Validate Compose without real credentials
        env:
          API_KEY: fixture-only
          NAPCAT_WEBUI_TOKEN: fixture-only
          ASTRBOT_IMAGE: soulter/astrbot:v4.29.1
          NAPCAT_IMAGE: mlikiowa/napcat-docker:latest
        run: docker compose config --quiet
